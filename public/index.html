<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Masterclass IA Dashboard</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Segoe UI', system-ui, sans-serif;
      background: #050c18;
      color: #e2e8f0;
      min-height: 100vh;
    }

    /* ── Header ── */
    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 1.25rem 2rem;
      background: rgba(255,255,255,0.03);
      border-bottom: 1px solid rgba(255,255,255,0.07);
      backdrop-filter: blur(12px);
      position: sticky;
      top: 0;
      z-index: 100;
    }
    header h1 {
      font-size: 1.4rem;
      font-weight: 700;
      background: linear-gradient(135deg, #2563EB, #6366F1, #ec4899);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }
    .header-right { display: flex; align-items: center; gap: 1rem; }
    .badge-live {
      display: flex; align-items: center; gap: 6px;
      background: rgba(16,185,129,0.15);
      border: 1px solid rgba(16,185,129,0.4);
      color: #10b981;
      padding: 4px 12px;
      border-radius: 999px;
      font-size: 0.75rem;
      font-weight: 600;
      letter-spacing: 0.05em;
    }
    .badge-live .dot {
      width: 8px; height: 8px;
      background: #10b981;
      border-radius: 50%;
      animation: pulse 1.5s infinite;
    }
    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.4; transform: scale(1.4); }
    }
    .last-update { font-size: 0.72rem; color: #64748b; }

    /* ── Layout ── */
    main { padding: 2rem; max-width: 1400px; margin: 0 auto; }

    /* ── KPI Cards ── */
    .kpi-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 1rem;
      margin-bottom: 2rem;
    }
    .kpi-card {
      background: rgba(255,255,255,0.04);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 16px;
      padding: 1.5rem;
      position: relative;
      overflow: hidden;
      transition: transform 0.2s, border-color 0.2s;
    }
    .kpi-card:hover { transform: translateY(-3px); border-color: rgba(99,102,241,0.4); }
    .kpi-card::before {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 3px;
      border-radius: 16px 16px 0 0;
    }
    .kpi-card:nth-child(1)::before { background: linear-gradient(90deg, #2563EB, #6366F1); }
    .kpi-card:nth-child(2)::before { background: linear-gradient(90deg, #6366F1, #ec4899); }
    .kpi-card:nth-child(3)::before { background: linear-gradient(90deg, #ec4899, #f59e0b); }
    .kpi-card:nth-child(4)::before { background: linear-gradient(90deg, #ef4444, #ec4899); }
    .kpi-label { font-size: 0.75rem; color: #94a3b8; text-transform: uppercase; letter-spacing: 0.08em; margin-bottom: 0.5rem; }
    .kpi-value { font-size: 2.4rem; font-weight: 800; line-height: 1; }
    .kpi-card:nth-child(1) .kpi-value { color: #6366F1; }
    .kpi-card:nth-child(2) .kpi-value { color: #a78bfa; }
    .kpi-card:nth-child(3) .kpi-value { color: #f472b6; }
    .kpi-card:nth-child(4) .kpi-value { color: #f87171; }
    .kpi-sub { font-size: 0.72rem; color: #64748b; margin-top: 0.4rem; }

    /* ── Charts ── */
    .charts-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 1rem;
      margin-bottom: 2rem;
    }
    .chart-card {
      background: rgba(255,255,255,0.04);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 16px;
      padding: 1.5rem;
    }
    .chart-card h2 { font-size: 0.85rem; color: #94a3b8; text-transform: uppercase; letter-spacing: 0.08em; margin-bottom: 1rem; }
    .chart-wrap { position: relative; height: 220px; display: flex; align-items: center; justify-content: center; }

    /* ── Table ── */
    .table-card {
      background: rgba(255,255,255,0.04);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 16px;
      padding: 1.5rem;
      margin-bottom: 2rem;
    }
    .table-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 1rem;
    }
    .table-header h2 { font-size: 0.85rem; color: #94a3b8; text-transform: uppercase; letter-spacing: 0.08em; }
    .btn-add {
      background: linear-gradient(135deg, #2563EB, #6366F1);
      color: #fff;
      border: none;
      padding: 8px 18px;
      border-radius: 8px;
      font-size: 0.8rem;
      font-weight: 600;
      cursor: pointer;
      transition: opacity 0.2s, transform 0.2s;
    }
    .btn-add:hover { opacity: 0.85; transform: translateY(-1px); }

    .table-wrap { overflow-x: auto; }
    table { width: 100%; border-collapse: collapse; font-size: 0.82rem; }
    thead tr { border-bottom: 1px solid rgba(255,255,255,0.08); }
    th { color: #64748b; font-weight: 600; text-transform: uppercase; font-size: 0.7rem; letter-spacing: 0.06em; padding: 0.6rem 0.8rem; text-align: left; }
    td { padding: 0.75rem 0.8rem; border-bottom: 1px solid rgba(255,255,255,0.04); }
    tbody tr:hover { background: rgba(255,255,255,0.03); }
    tbody tr:last-child td { border-bottom: none; }

    .badge-temp {
      display: inline-flex; align-items: center; gap: 4px;
      padding: 3px 10px; border-radius: 999px; font-size: 0.72rem; font-weight: 700;
    }
    .badge-hot { background: rgba(239,68,68,0.15); color: #f87171; border: 1px solid rgba(239,68,68,0.3); }
    .badge-warm { background: rgba(245,158,11,0.15); color: #fbbf24; border: 1px solid rgba(245,158,11,0.3); }
    .badge-cold { background: rgba(59,130,246,0.15); color: #60a5fa; border: 1px solid rgba(59,130,246,0.3); }

    .note-stars { color: #fbbf24; }

    /* ── Modal ── */
    .modal-overlay {
      display: none;
      position: fixed; inset: 0;
      background: rgba(0,0,0,0.7);
      backdrop-filter: blur(4px);
      z-index: 200;
      align-items: center;
      justify-content: center;
    }
    .modal-overlay.open { display: flex; }
    .modal {
      background: #0f1829;
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 20px;
      padding: 2rem;
      width: 100%;
      max-width: 480px;
      animation: slideUp 0.25s ease;
    }
    @keyframes slideUp {
      from { transform: translateY(30px); opacity: 0; }
      to { transform: translateY(0); opacity: 1; }
    }
    .modal h2 { font-size: 1.1rem; font-weight: 700; margin-bottom: 1.5rem; color: #e2e8f0; }
    .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 0.75rem; }
    .form-group { display: flex; flex-direction: column; gap: 4px; }
    .form-group.full { grid-column: 1 / -1; }
    label { font-size: 0.72rem; color: #94a3b8; text-transform: uppercase; letter-spacing: 0.06em; }
    input, select {
      background: rgba(255,255,255,0.06);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 8px;
      color: #e2e8f0;
      padding: 8px 12px;
      font-size: 0.82rem;
      outline: none;
      transition: border-color 0.2s;
    }
    input:focus, select:focus { border-color: #6366F1; }
    select option { background: #0f1829; }
    .modal-actions { display: flex; gap: 0.75rem; margin-top: 1.5rem; justify-content: flex-end; }
    .btn-cancel {
      background: transparent;
      border: 1px solid rgba(255,255,255,0.15);
      color: #94a3b8;
      padding: 8px 18px;
      border-radius: 8px;
      font-size: 0.8rem;
      cursor: pointer;
      transition: border-color 0.2s;
    }
    .btn-cancel:hover { border-color: rgba(255,255,255,0.3); }
    .btn-submit {
      background: linear-gradient(135deg, #2563EB, #6366F1);
      color: #fff;
      border: none;
      padding: 8px 20px;
      border-radius: 8px;
      font-size: 0.8rem;
      font-weight: 600;
      cursor: pointer;
      transition: opacity 0.2s;
    }
    .btn-submit:hover { opacity: 0.85; }

    @media (max-width: 600px) {
      main { padding: 1rem; }
      .form-grid { grid-template-columns: 1fr; }
      .form-group.full { grid-column: 1; }
    }
  </style>
</head>
<body>

<header>
  <h1>⚡ Masterclass IA Dashboard</h1>
  <div class="header-right">
    <span class="last-update" id="lastUpdate">Chargement…</span>
    <div class="badge-live"><span class="dot"></span>LIVE</div>
  </div>
</header>

<main>
  <!-- KPI Cards -->
  <div class="kpi-grid">
    <div class="kpi-card">
      <div class="kpi-label">Total répondants</div>
      <div class="kpi-value" id="kpiTotal">–</div>
      <div class="kpi-sub">participants enregistrés</div>
    </div>
    <div class="kpi-card">
      <div class="kpi-label">Note moyenne</div>
      <div class="kpi-value" id="kpiNote">–</div>
      <div class="kpi-sub">sur 5</div>
    </div>
    <div class="kpi-card">
      <div class="kpi-label">Taux Excellent</div>
      <div class="kpi-value" id="kpiExcellent">–</div>
      <div class="kpi-sub">ont noté Excellent</div>
    </div>
    <div class="kpi-card">
      <div class="kpi-label">Leads chauds 🔥</div>
      <div class="kpi-value" id="kpiHot">–</div>
      <div class="kpi-sub">score ≥ 5</div>
    </div>
  </div>

  <!-- Charts -->
  <div class="charts-grid">
    <div class="chart-card">
      <h2>Satisfaction</h2>
      <div class="chart-wrap"><canvas id="chartSatisfaction"></canvas></div>
    </div>
    <div class="chart-card">
      <h2>Profils</h2>
      <div class="chart-wrap"><canvas id="chartProfils"></canvas></div>
    </div>
  </div>

  <!-- Table -->
  <div class="table-card">
    <div class="table-header">
      <h2>Leads</h2>
      <button class="btn-add" onclick="openModal()">+ Ajouter un répondant</button>
    </div>
    <div class="table-wrap">
      <table>
        <thead>
          <tr>
            <th>Nom</th>
            <th>Email</th>
            <th>Note</th>
            <th>Statut</th>
            <th>Projet Afrique</th>
            <th>Score</th>
            <th>Lead</th>
          </tr>
        </thead>
        <tbody id="tableBody"></tbody>
      </table>
    </div>
  </div>
</main>

<!-- Modal -->
<div class="modal-overlay" id="modalOverlay">
  <div class="modal">
    <h2>Ajouter un répondant</h2>
    <div class="form-grid">
      <div class="form-group">
        <label>Nom</label>
        <input id="fNom" type="text" placeholder="DUPONT" />
      </div>
      <div class="form-group">
        <label>Prénom</label>
        <input id="fPrenom" type="text" placeholder="Marie" />
      </div>
      <div class="form-group full">
        <label>Email</label>
        <input id="fEmail" type="email" placeholder="marie@exemple.com" />
      </div>
      <div class="form-group">
        <label>Note (1–5)</label>
        <select id="fNote">
          <option value="5">5 – Excellent</option>
          <option value="4">4 – Très bien</option>
          <option value="3">3 – Bien</option>
          <option value="2">2 – Passable</option>
          <option value="1">1 – Insuffisant</option>
        </select>
      </div>
      <div class="form-group">
        <label>Statut</label>
        <select id="fStatut">
          <option>Entrepreneur</option>
          <option>Salarié</option>
          <option>Étudiant</option>
          <option>Autre</option>
        </select>
      </div>
      <div class="form-group full">
        <label>Projet Afrique</label>
        <select id="fProjet">
          <option>Non</option>
          <option>Oui, en cours</option>
          <option>Oui, en réflexion</option>
          <option>Non, mais intéressé</option>
        </select>
      </div>
    </div>
    <div class="modal-actions">
      <button class="btn-cancel" onclick="closeModal()">Annuler</button>
      <button class="btn-submit" onclick="submitForm()">Ajouter</button>
    </div>
  </div>
</div>

<script>
  const NOTE_LABELS = { 1: 'Insuffisant', 2: 'Passable', 3: 'Bien', 4: 'Très bien', 5: 'Excellent' };
  const CHART_COLORS = ['#2563EB','#6366F1','#ec4899','#f59e0b','#10b981','#ef4444'];

  let chartSat = null, chartProf = null;
  let lastFetch = null;

  function stars(n) {
    return '<span class="note-stars">' + '★'.repeat(n) + '<span style="color:#334155">' + '★'.repeat(5 - n) + '</span></span>';
  }

  function tempBadge(t) {
    if (t === 'hot') return '<span class="badge-temp badge-hot">🔥 Hot</span>';
    if (t === 'warm') return '<span class="badge-temp badge-warm">🟡 Warm</span>';
    return '<span class="badge-temp badge-cold">🔵 Cold</span>';
  }

  function updateLastUpdate() {
    if (!lastFetch) return;
    const sec = Math.round((Date.now() - lastFetch) / 1000);
    document.getElementById('lastUpdate').textContent =
      sec < 5 ? 'Dernière mise à jour : à l\'instant' : `Dernière mise à jour : il y a ${sec}s`;
  }

  function renderTable(data) {
    const tbody = document.getElementById('tableBody');
    tbody.innerHTML = data.map(r => `
      <tr>
        <td><strong>${r.nom} ${r.prenom}</strong></td>
        <td style="color:#94a3b8">${r.email}</td>
        <td>${stars(r.note)}</td>
        <td>${r.statut || '–'}</td>
        <td style="color:#94a3b8;font-size:0.78rem">${r.projetAfrique || '–'}</td>
        <td><strong style="color:#e2e8f0">${r.score}</strong></td>
        <td>${tempBadge(r.temperature)}</td>
      </tr>
    `).join('');
  }

  function renderCharts(summary) {
    const notes = summary.noteCounts;
    const satLabels = ['1★', '2★', '3★', '4★', '5★'];
    const satData = [notes[1], notes[2], notes[3], notes[4], notes[5]];

    if (chartSat) chartSat.destroy();
    chartSat = new Chart(document.getElementById('chartSatisfaction'), {
      type: 'doughnut',
      data: {
        labels: satLabels,
        datasets: [{ data: satData, backgroundColor: CHART_COLORS, borderWidth: 0, hoverOffset: 6 }]
      },
      options: {
        cutout: '68%',
        plugins: {
          legend: { position: 'right', labels: { color: '#94a3b8', font: { size: 11 }, padding: 12 } }
        }
      }
    });

    const statuts = summary.statutCounts;
    const profLabels = Object.keys(statuts);
    const profData = profLabels.map(k => statuts[k]);

    if (chartProf) chartProf.destroy();
    chartProf = new Chart(document.getElementById('chartProfils'), {
      type: 'doughnut',
      data: {
        labels: profLabels,
        datasets: [{ data: profData, backgroundColor: CHART_COLORS.slice(1), borderWidth: 0, hoverOffset: 6 }]
      },
      options: {
        cutout: '68%',
        plugins: {
          legend: { position: 'right', labels: { color: '#94a3b8', font: { size: 11 }, padding: 12 } }
        }
      }
    });
  }

  async function fetchAll() {
    try {
      const [dataRes, sumRes] = await Promise.all([
        fetch('/api/data'),
        fetch('/api/summary')
      ]);
      const data = await dataRes.json();
      const summary = await sumRes.json();

      document.getElementById('kpiTotal').textContent = summary.total;
      document.getElementById('kpiNote').textContent = summary.avgNote;
      document.getElementById('kpiExcellent').textContent = summary.tauxExcellent + '%';
      document.getElementById('kpiHot').textContent = summary.hotLeads;

      renderTable(data);
      renderCharts(summary);

      lastFetch = Date.now();
      updateLastUpdate();
    } catch (e) {
      console.error('Fetch error:', e);
    }
  }

  // Refresh every 30 seconds
  fetchAll();
  setInterval(fetchAll, 30000);
  setInterval(updateLastUpdate, 1000);

  // Modal
  function openModal() {
    document.getElementById('modalOverlay').classList.add('open');
  }
  function closeModal() {
    document.getElementById('modalOverlay').classList.remove('open');
  }
  document.getElementById('modalOverlay').addEventListener('click', e => {
    if (e.target === e.currentTarget) closeModal();
  });

  async function submitForm() {
    const note = parseInt(document.getElementById('fNote').value);
    const payload = {
      nom: document.getElementById('fNom').value.trim(),
      prenom: document.getElementById('fPrenom').value.trim(),
      email: document.getElementById('fEmail').value.trim(),
      note,
      noteLabel: NOTE_LABELS[note],
      statut: document.getElementById('fStatut').value,
      projetAfrique: document.getElementById('fProjet').value,
      accompagnement: '',
      echange: '',
      optinSlides: false,
      apprecie: '', amelioration: '', besoin: '', localisation: ''
    };
    if (!payload.nom || !payload.email) {
      alert('Nom et email obligatoires.');
      return;
    }
    try {
      await fetch('/api/respondent', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload)
      });
      closeModal();
      fetchAll();
    } catch (e) {
      alert('Erreur lors de l\'ajout.');
    }
  }
</script>
</body>
</html>
